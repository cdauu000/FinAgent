[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "finagent"
version = "0.0.1"
description = "Backend FinAgent: local financial evidence and deterministic analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["finagent"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["schemas/draft"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["finagent", "eval"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: schema and module boundary contracts",
  "golden: source-backed regression oracles",
  "integration: requires actual infrastructure",
]

